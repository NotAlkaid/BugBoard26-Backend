spring.application.name=BugBoard26-Backend

# Questa riga dice a Spring di creare le tabelle se non esistono o di aggiornarle se lo schema del database è cambiato
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Silenzia il warning intenzionale sull'AuthenticationProvider personalizzato
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Connessione al DB Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

application.security.jwt.secret-key=${SECRET_KEY}
application.security.jwt.expiration=86400000

# Credenziali Admin di Default (con valori di fallback)
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@bugboard26.com}
app.default-admin.username=${DEFAULT_ADMIN_USERNAME:admin}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:adminpassword123}

# SpringDoc OpenAPI / Swagger UI 
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# CORS Configuration (Origini frontend ammesse, separate da virgola)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}